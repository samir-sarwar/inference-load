[project]
name = "inference-load-lab"
version = "0.1.0"
description = "Reproducible LLM serving and load-testing experiments with vLLM"
readme = "README.md"
authors = [
    { name = "Samir Sarwar", email = "samirsarwaremail@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
inference-load-lab = "inference_load_lab:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
