[project]
name = "inference-load-lab"
version = "0.1.0"
description = "Reproducible LLM serving and load-testing experiments with vLLM"
readme = "README.md"
authors = [
    { name = "Samir Sarwar", email = "samirsarwaremail@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.16.0",
    "httpx>=0.28.1",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
inference-load-lab = "inference_load_lab:main"

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
